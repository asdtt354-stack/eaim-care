<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>동그란 말 연습 — 뾰족한 말 바꾸기</title>
<style>
  :root{
    --paper:#fdf9f6; --ink:#332f2b; --soft:#7d7268; --line:#ece2da;
    --main:#c9553f; --deep:#a03f2d; --bg:#fdf0ec; --mline:#f2d3c8;
    --gold:#d9a441; --ok:#2f8a66; --okbg:#eefaf3; --okline:#bfe6d2;
  }
  *{box-sizing:border-box}
  html,body{background:var(--paper)}
  body{margin:0;color:var(--ink);line-height:1.6;padding:22px 16px 80px;
    font-family:'Pretendard','Malgun Gothic',sans-serif}
  .wrap{max-width:600px;margin:0 auto}

  header.top h1{margin:0;font-size:1.55rem;letter-spacing:-.02em;display:flex;align-items:center;gap:9px}
  header.top .bar{width:44px;height:4px;border-radius:99px;margin-top:9px;
    background:linear-gradient(90deg,var(--main),var(--gold))}
  header.top p{margin:9px 0 22px;color:var(--soft);font-size:.9rem}

  button{font-family:inherit;cursor:pointer}

  .progress{display:flex;align-items:center;gap:11px;margin-bottom:16px}
  .track{flex:1;height:7px;background:var(--line);border-radius:99px;overflow:hidden}
  .fill{height:100%;background:linear-gradient(90deg,var(--main),var(--gold));width:0;transition:width .4s}
  .pnum{font-size:.83rem;color:var(--soft);font-weight:700;white-space:nowrap}

  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;
    box-shadow:0 3px 14px rgba(120,80,60,.05)}
  .scene{font-size:.87rem;color:var(--soft);margin:0 0 12px}

  .sharp{background:#fdeeec;border:1.5px solid #f0c4b9;border-radius:14px;padding:17px 18px;position:relative}
  .sharp .tag{font-size:.74rem;font-weight:800;color:var(--deep);display:block;margin-bottom:5px}
  .sharp p{margin:0;font-size:1.14rem;font-weight:800;color:#8a3a26}

  .arrow{text-align:center;color:var(--soft);font-size:1.3rem;margin:12px 0 6px}

  label{display:block;font-weight:700;font-size:.85rem;margin:0 0 7px;color:var(--soft)}
  textarea{width:100%;padding:13px 15px;border:1.5px solid var(--line);border-radius:13px;
    font-size:1.05rem;font-family:inherit;background:#fffdfb;resize:vertical;min-height:78px;line-height:1.55}
  textarea:focus{outline:none;border-color:var(--main);background:#fff}

  .go{width:100%;padding:15px;border:0;border-radius:13px;color:#fff;font-size:1.03rem;font-weight:800;
    margin-top:13px;background:linear-gradient(135deg,var(--main),var(--deep));
    box-shadow:0 6px 16px rgba(201,85,63,.24)}
  .go:disabled{opacity:.4;box-shadow:none;cursor:default}
  .go.sub{background:#fff;color:var(--deep);border:1.5px solid var(--mline);box-shadow:none}

  /* 채점 결과 */
  .result{display:none;margin-top:16px}
  .gained{background:var(--okbg);border:1.5px solid var(--okline);border-radius:14px;padding:16px}
  .gained .head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:9px}
  .gained .head b{color:var(--ok);font-size:.85rem}
  .gained .head .pt{font-weight:800;color:var(--ok);font-size:1.15rem}
  .gained ul{margin:0;padding-left:18px}
  .gained li{font-size:.9rem;color:#1d6b48;margin:4px 0}
  .miss{background:#fff8e8;border:1.5px solid #edd9a8;border-radius:14px;padding:16px;margin-top:10px}
  .miss b{display:block;color:#7a5c1e;font-size:.85rem;margin-bottom:7px}
  .miss ul{margin:0;padding-left:18px}
  .miss li{font-size:.89rem;color:#7a5c1e;margin:4px 0}
  .sample{background:#f7f4f1;border:1px dashed var(--line);border-radius:13px;padding:15px;margin-top:10px}
  .sample b{display:block;font-size:.78rem;color:var(--soft);margin-bottom:5px}
  .sample p{margin:0;font-size:.98rem}
  .sample .note{font-size:.79rem;color:var(--soft);margin-top:7px}

  /* 마무리 */
  .final{display:none;text-align:center}
  .final .big{font-size:2.6rem}
  .final .score{font-size:2.1rem;font-weight:800;color:var(--deep);margin:6px 0 2px}
  .final .msg{color:var(--soft);font-size:.93rem;margin:0 0 18px}
  .mine{text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;
    padding:16px;margin-bottom:11px}
  .mine .s{font-size:.83rem;color:var(--soft);text-decoration:line-through}
  .mine .r{font-weight:700;margin-top:4px}
  .hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <h1>🌈 동그란 말 연습</h1>
    <div class="bar"></div>
    <p id="sub">뾰족하게 튀어나온 말을, 마음은 그대로 두고 모양만 바꿔봐요</p>
  </header>

  <div class="progress" id="progressBar">
    <div class="track"><div class="fill" id="fill"></div></div>
    <span class="pnum" id="pnum">1 / 8</span>
  </div>

  <section class="card" id="playCard">
    <p class="scene" id="scene"></p>

    <div class="sharp">
      <span class="tag">⚡ 뾰족한 말</span>
      <p id="sharpText"></p>
    </div>

    <div class="arrow">↓</div>

    <label for="answer">🌈 동그란 말로 바꿔 쓰기</label>
    <textarea id="answer" placeholder="마음은 그대로 두고, 말하는 방법만 바꿔보세요"></textarea>
    <button class="go" id="checkBtn" onclick="check()" disabled>바꾼 말 확인하기</button>

    <div class="result" id="result"></div>
    <button class="go sub hidden" id="nextBtn" onclick="next()">다음 →</button>
  </section>

  <section class="card final" id="finalCard">
    <div class="big">🌈</div>
    <p class="score"><span id="totalScore">0</span>점</p>
    <p class="msg" id="finalMsg"></p>
    <div id="mineList"></div>
    <button class="go" id="sendBtn" onclick="send()">선생님께 보내기</button>
    <button class="go sub" onclick="location.reload()" style="margin-top:9px">다시 하기</button>
  </section>

</div>

<script>
  /* ── 문제 ── */
  const ITEMS = [
    { scene:'동생이 내 물건을 말없이 가져갔을 때',
      sharp:'야, 내 거 왜 손대! 진짜 짜증나.',
      sample:'내 물건 쓸 때는 먼저 물어봐 줄래? 말없이 없어지면 당황스러워.' },
    { scene:'엄마가 게임하는 나를 보고 뭐라고 하셨을 때',
      sharp:'아 왜 자꾸 잔소리야!',
      sample:'저는 공부하느라 힘들어서 딱 20분만 쉬고 싶었어요. 끝나면 바로 할게요.' },
    { scene:'친구가 약속에 또 늦게 왔을 때',
      sharp:'너는 맨날 늦냐?',
      sample:'나 혼자 기다리는 동안 좀 서운했어. 다음엔 늦으면 미리 연락해 줄 수 있어?' },
    { scene:'아빠가 내 성적을 형(누나)과 비교하셨을 때',
      sharp:'그럼 형이랑만 살든가.',
      sample:'저는 비교당하면 많이 속상해요. 제가 노력한 부분도 봐주시면 좋겠어요.' },
    { scene:'모둠 활동에서 한 친구가 아무것도 안 할 때',
      sharp:'너 그냥 빠져. 우리끼리 할게.',
      sample:'우리 시간이 부족해서 걱정돼. 네가 이 부분만 맡아주면 큰 도움이 될 것 같아.' },
    { scene:'엄마가 방을 치우라고 하셨을 때',
      sharp:'이따가 한다고!',
      sample:'지금 숙제 중이라서요, 이거 끝나고 30분 뒤에 치울게요.' },
    { scene:'친구가 내 별명을 계속 부를 때',
      sharp:'닥쳐, 그렇게 부르지 마.',
      sample:'나는 그 별명이 불편해. 앞으로는 이름으로 불러주면 좋겠어.' },
    { scene:'선생님이 내 발표를 다시 하라고 하셨을 때',
      sharp:'그냥 안 할래요.',
      sample:'준비한 게 부족했던 것 같아서 좀 막막해요. 어디를 고치면 좋을지 알려주실 수 있을까요?' },
  ];

  /* ── 채점 규칙 (AI가 아니라 문장 자체를 봅니다) ── */
  const RULES = [
    { key:'i',    pt:20, test:s => /(^|[\s"'])(저는|제가|나는|내가|난 |전 )/.test(s),
      good:'"너"가 아니라 <b>내 이야기</b>로 시작했어요. 나 전달법이에요.',
      tip:'"저는 ~", "나는 ~"처럼 내 이야기로 시작해보기' },
    { key:'ask',  pt:20, test:s => /(주세요|주면|줄래|줄 수 있|해 주시|주시면|부탁|어떨까|할까요|좋겠)/.test(s),
      good:'명령이 아니라 <b>부탁하는 말</b>로 바꿨어요.',
      tip:'"~해줄래?", "~하면 좋겠어"처럼 부탁으로 바꿔보기' },
    { key:'why',  pt:20, test:s => /(왜냐하면|때문에|라서|어서|느라|하느라|이라)/.test(s),
      good:'<b>까닭을 함께</b> 말했어요. 상대가 이해하기 훨씬 쉬워져요.',
      tip:'"~라서", "~때문에"로 까닭을 붙여보기' },
    { key:'feel', pt:20, test:s => /(속상|서운|힘들|답답|미안|고맙|감사|섭섭|외로|불안|걱정|당황|막막|서럽|슬프|화가)/.test(s),
      good:'<b>내 기분을 말</b>로 표현했어요. 참지 않고 말한 게 중요해요.',
      tip:'"속상해", "걱정돼"처럼 기분을 말로 써보기' },
    { key:'spec', pt:20, test:s => /(조금만|잠깐|딱 |먼저|다음엔|다음부터|이번엔|앞으로|분 |시간|뒤에|까지)/.test(s),
      good:'<b>구체적으로</b> 말했어요. 막연한 말보다 훨씬 잘 통해요.',
      tip:'"30분 뒤에", "다음부터는"처럼 구체적으로 말해보기' },
  ];
  const STILL_SHARP = /(야[!,\s]|닥쳐|짜증|싫어|맨날|진짜 |왜 자꾸|그냥 안|빠져|미친|바보)/;

  let idx = 0, total = 0;
  const mine = [];

  const $ = id => document.getElementById(id);

  function draw() {
    const it = ITEMS[idx];
    $('scene').innerText = it.scene;
    $('sharpText').innerText = it.sharp;
    $('answer').value = '';
    $('answer').disabled = false;
    $('result').style.display = 'none';
    $('result').innerHTML = '';
    $('checkBtn').classList.remove('hidden');
    $('checkBtn').disabled = true;
    $('nextBtn').classList.add('hidden');
    $('pnum').innerText = `${idx + 1} / ${ITEMS.length}`;
    $('fill').style.width = (idx / ITEMS.length * 100) + '%';
  }

  $('answer').addEventListener('input', e => {
    $('checkBtn').disabled = e.target.value.trim().length < 5;
  });

  function check() {
    const s = $('answer').value.trim();
    const it = ITEMS[idx];

    const hit = RULES.filter(r => r.test(s));
    const missed = RULES.filter(r => !r.test(s));
    let pt = hit.reduce((a, r) => a + r.pt, 0);
    if (pt > 100) pt = 100;
    total += pt;
    mine.push({ scene: it.scene, sharp: it.sharp, round: s, pt });

    let html = `
      <div class="gained">
        <div class="head"><b>바뀐 점</b><span class="pt">+${pt}점</span></div>
        ${hit.length ? '<ul>' + hit.map(r => `<li>${r.good}</li>`).join('') + '</ul>'
                     : '<p style="margin:0;font-size:.9rem;color:#1d6b48">마음을 전하려고 한 게 보여요. 아래 방법을 하나만 더 써볼까요?</p>'}
      </div>`;

    if (missed.length) {
      html += `<div class="miss"><b>이렇게 하면 더 동그래져요</b>
        <ul>${missed.slice(0, 2).map(r => `<li>${r.tip}</li>`).join('')}</ul></div>`;
    }
    if (STILL_SHARP.test(s)) {
      html += `<div class="miss"><b>아직 뾰족한 말이 남아 있어요</b>
        <ul><li>상대를 탓하는 말이 섞이면, 하고 싶은 말이 잘 안 들려요.</li></ul></div>`;
    }

    html += `<div class="sample"><b>이렇게도 말할 수 있어요</b>
      <p>${it.sample}</p>
      <p class="note">정답은 아니에요. 내 말이 더 나을 수도 있어요.</p></div>`;

    $('result').innerHTML = html;
    $('result').style.display = 'block';
    $('answer').disabled = true;
    $('checkBtn').classList.add('hidden');
    $('nextBtn').classList.remove('hidden');
    $('nextBtn').innerText = (idx === ITEMS.length - 1) ? '결과 보기 →' : '다음 →';
  }

  function next() {
    idx++;
    if (idx < ITEMS.length) { draw(); window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
    finish();
  }

  function finish() {
    $('playCard').classList.add('hidden');
    $('progressBar').classList.add('hidden');
    $('finalCard').style.display = 'block';

    const avg = Math.round(total / ITEMS.length);
    $('totalScore').innerText = total;
    $('finalMsg').innerText =
      avg >= 80 ? '말의 모양을 아주 잘 바꿨어요. 이제 진짜로 한번 해볼까요?' :
      avg >= 50 ? '많이 동그래졌어요. 까닭과 기분을 더 붙이면 훨씬 잘 통해요.' :
                  '괜찮아요. 처음엔 다 어려워요. 내 이야기로 시작하는 것부터 해봐요.';

    $('mineList').innerHTML = mine.map(m => `
      <div class="mine">
        <p class="s">${esc(m.sharp)}</p>
        <p class="r">🌈 ${esc(m.round)}</p>
      </div>`).join('');

    if (!window.EAIM_STUDENT) $('sendBtn').classList.add('hidden');
  }

  function esc(s) {
    return String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  }

  async function send() {
    const btn = $('sendBtn');
    btn.disabled = true; btn.innerText = '보내는 중...';
    await window.EAIM_SAVE_WORK({
      kind: '동그란 말 연습',
      title: `${total}점 / ${ITEMS.length}문제`,
      content: mine.map(m => `· ${m.sharp}\n  → ${m.round}`).join('\n\n'),
      extra: { score: total, count: ITEMS.length }
    });
    btn.innerText = '✓ 보냈어요';
  }

  draw();
</script>

<!-- ══ EAIM 교실 연동 ══ -->
<script>
  window.EAIM_APP_TYPE = 'round-words';
  window.EAIM_TRACK    = 'mind';
</script>
<script type="module">
  import { mountStudentGate, saveWork, toast } from './eaim-classroom-core.js';

  window.EAIM_SAVE_WORK = async (payload) => {
    try {
      const id = await saveWork(payload);
      if (id) toast('선생님께 보냈어요');
    } catch (e) { console.error(e); toast('보내지 못했어요', false); }
  };

  mountStudentGate({
    onReady: (student) => {
      if (!student) return;
      const sub = document.getElementById('sub');
      if (sub) sub.textContent = `${student.roomTitle} · ${student.className || ''} ${student.number}번`;
    }
  });
</script>
</body>
</html>
